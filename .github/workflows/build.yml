name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build with Gradle
      run: |
        echo "Looking for Android project..."
        # اگر فایل gradlew بود از آن استفاده می‌کند، اگر نبود از گریدل سیستم استفاده می‌کند
        if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
        elif [ -f "Management-3/gradlew" ]; then
            cd Management-3
            chmod +x gradlew
            ./gradlew assembleDebug
        else
            # پیدا کردن مسیر فایل settings.gradle برای اجرای دستور گریدل
            PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
                echo "Error: Could not find the Android project root (settings.gradle)."
                exit 1
            fi
            echo "Project found in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
