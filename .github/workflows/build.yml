name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        echo "Searching for the Android project root..."
        # پیدا کردن مسیر فایلی که settings.gradle نام دارد
        PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find the Android project (settings.gradle not found)."
          exit 1
        fi
        
        echo "Project found in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # ساخت برنامه با استفاده از Gradle
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
